name: Build FinGuard APK Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle -p android :app:assembleDebug
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/finguard-mobile.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/finguard-mobile.apk

  release:
    runs-on: ubuntu-latest
    needs: build-android
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/finguard-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
